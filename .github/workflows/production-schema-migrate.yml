name: Production Schema Migration

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: production-schema-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.title == '[RC] APPLY_RC_SCHEMA_PRODUCTION' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.title == '[RC] APPLY_RC_SCHEMA_PRODUCTION' &&
       github.event.comment.body == '/apply-rc-schema-production' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERCEL_SCOPE: tehkne-solutions-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify credentials
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "RC_SCHEMA_MIGRATION=BLOCKED missing=VERCEL_TOKEN"; exit 2; }
          test -n "$CRON_SECRET" || { echo "RC_SCHEMA_MIGRATION=BLOCKED missing=CRON_SECRET"; exit 2; }

      - name: Resolve expected migration count
        id: expected
        shell: bash
        run: |
          count=$(find prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql | wc -l | tr -d ' ')
          test "$count" -gt 0
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "RC_SCHEMA_EXPECTED_MIGRATIONS=$count"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link canonical project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Inspect current schema
        id: before
        env:
          EXPECTED_MIGRATIONS: ${{ steps.expected.outputs.count }}
        shell: bash
        run: |
          set +e
          response=$(vercel curl /api/internal/schema-readiness -- --silent --show-error --fail-with-body --header "Authorization: Bearer $CRON_SECRET")
          status=$?
          set -e
          printf '%s\n' "$response"
          if [ "$status" -ne 0 ]; then
            echo "RC_SCHEMA_MIGRATION=BLOCKED readiness_unavailable"
            exit "$status"
          fi
          evaluation=$(printf '%s' "$response" | node -e '
            let b="";
            process.stdin.on("data",c=>b+=c);
            process.stdin.on("end",()=>{
              const p=JSON.parse(b);
              const expected=Number(process.env.EXPECTED_MIGRATIONS);
              const completed=Number(p.completedMigrationCount ?? 0);
              const ready=p.schemaReady===true && completed>=expected;
              process.stdout.write(`${ready ? "true" : "false"}:${completed}`);
            });
          ')
          ready=${evaluation%%:*}
          completed=${evaluation##*:}
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "completed=$completed" >> "$GITHUB_OUTPUT"
          echo "RC_SCHEMA_BEFORE completed=$completed expected=$EXPECTED_MIGRATIONS ready=$ready"

      - name: Deploy main with one-time migration authorization
        if: steps.before.outputs.ready != 'true'
        id: deploy
        shell: bash
        run: |
          URL=$(vercel deploy --prod --yes \
            --build-env TKN_SCHEMA_MIGRATION_CONFIRMATION=APPLY_RC_SCHEMA_PRODUCTION \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "RC_SCHEMA_MIGRATION_DEPLOYMENT=$URL"

      - name: Verify migrated schema
        id: after
        env:
          EXPECTED_MIGRATIONS: ${{ steps.expected.outputs.count }}
        shell: bash
        run: |
          response=$(vercel curl /api/internal/schema-readiness -- --silent --show-error --fail-with-body --header "Authorization: Bearer $CRON_SECRET")
          printf '%s\n' "$response"
          printf '%s' "$response" | node -e '
            let b="";
            process.stdin.on("data",c=>b+=c);
            process.stdin.on("end",()=>{
              const p=JSON.parse(b);
              const expected=Number(process.env.EXPECTED_MIGRATIONS);
              const completed=Number(p.completedMigrationCount ?? 0);
              console.log(`RC_SCHEMA_AFTER completed=${completed} expected=${expected} schemaReady=${p.schemaReady}`);
              if(p.schemaReady!==true || completed<expected) process.exit(2);
            });
          '
          echo "RC_SCHEMA_MIGRATION=PASS expected=$EXPECTED_MIGRATIONS"

      - name: Comment approval issue
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECTED_MIGRATIONS: ${{ steps.expected.outputs.count }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/comment.json
          import json, os
          print(json.dumps({"body": f"Production schema migration completed and verified against {os.environ['EXPECTED_MIGRATIONS']} versioned migrations.\n\nRun: {os.environ['RUN_URL']}\n\nSignature: **Tehkné Solutions**"}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-binary @/tmp/comment.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"

      - name: Comment failure evidence
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/comment.json
          import json, os
          print(json.dumps({"body": f"Production schema migration did **not** complete. No GO is granted. Inspect the fail-closed run: {os.environ['RUN_URL']}\n\nSignature: **Tehkné Solutions**"}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-binary @/tmp/comment.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"
