name: RC Workspace Bootstrap

on:
  push:
    branches: [main]
    paths:
      - "src/modules/growth-operations/rc-workspace.ts"
      - "src/modules/growth-operations/schema-readiness.ts"
      - "src/app/api/internal/rc-workspace/route.ts"
      - "src/app/api/internal/schema-readiness/route.ts"
      - "scripts/rc-workspace-*.sql"
      - "scripts/psql-database-url.mjs"
      - ".github/workflows/rc-workspace-bootstrap.yml"
      - ".github/workflows/release-candidate-deploy.yml"
      - "docs/releases/RC-1.md"
  pull_request:
    paths:
      - "src/modules/growth-operations/rc-workspace.ts"
      - "src/modules/growth-operations/schema-readiness.ts"
      - "src/app/api/internal/rc-workspace/route.ts"
      - "src/app/api/internal/schema-readiness/route.ts"
      - "tests/integration/rc-workspace-postgres.test.ts"
      - "tests/integration/schema-readiness-postgres.test.ts"
      - "scripts/rc-workspace-*.sql"
      - "scripts/psql-database-url.mjs"
      - ".github/workflows/rc-workspace-bootstrap.yml"
      - ".github/workflows/release-candidate-deploy.yml"
      - "docs/releases/RC-1.md"
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: rc-workspace-bootstrap-${{ contains(fromJSON('["issues","issue_comment"]'), github.event_name) && 'production-apply' || github.ref }}
  cancel-in-progress: false

jobs:
  validate-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: growth_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d growth_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/growth_os?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Prepare psql connection URL
        shell: bash
        run: echo "PSQL_DATABASE_URL=$(node scripts/psql-database-url.mjs)" >> "$GITHUB_ENV"

      - name: Inspect empty RC state
        run: psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/rc-workspace-inspect.sql

      - name: Apply bootstrap twice to prove idempotency
        shell: bash
        run: |
          psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/rc-workspace-bootstrap.sql
          psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/rc-workspace-bootstrap.sql

      - name: Verify tenant hierarchy and audit evidence
        shell: bash
        run: |
          workspace_count=$(psql "$PSQL_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "
            SELECT COUNT(*)
            FROM workspaces w
            JOIN client_organizations c ON c.id = w.client_organization_id
            JOIN operator_organizations o ON o.id = w.operator_organization_id
            WHERE o.slug = 'tehkne-solutions'
              AND c.slug = 'tkn-growth-rc'
              AND w.slug = 'rc-validation';
          ")
          audit_count=$(psql "$PSQL_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "
            SELECT COUNT(*)
            FROM audit_events
            WHERE action = 'rc.workspace.bootstrap'
              AND resource_type = 'workspace';
          ")
          resolved_id=$(psql "$PSQL_DATABASE_URL" -At -v ON_ERROR_STOP=1 -f scripts/rc-workspace-id.sql | tail -n 1 | tr -d '\r')

          test "$workspace_count" = "1"
          test "$audit_count" = "1"
          test "$resolved_id" = "93000000-0000-4000-8000-000000000001"
          echo "RC_WORKSPACE_SQL=PASS workspace_count=$workspace_count audit_count=$audit_count workspace_id=$resolved_id"

  apply-production:
    needs: validate-sql
    if: >-
      (github.event_name == 'issues' &&
       github.event.action == 'opened' &&
       github.event.issue.title == '[RC] APPLY_RC_WORKSPACE_PRODUCTION' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.title == '[RC] APPLY_RC_WORKSPACE_PRODUCTION' &&
       github.event.comment.body == '/apply-rc-workspace-production' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_SCOPE: tehkne-solutions-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify production credentials
        shell: bash
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "RC_WORKSPACE_APPLY=BLOCKED missing=$missing"
            exit 2
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link canonical Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify production schema readiness
        shell: bash
        run: |
          set +e
          response=$(vercel curl /api/internal/schema-readiness \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          status=$?
          set -e
          printf '%s\n' "$response"
          if [ "$status" -ne 0 ]; then
            echo "RC_WORKSPACE_APPLY=BLOCKED schema_probe_unavailable"
            exit "$status"
          fi

          schema_ready=$(printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(body);
              process.stdout.write(parsed.schemaReady === true ? "true" : "false");
            });
          ')
          if [ "$schema_ready" != "true" ]; then
            echo "RC_WORKSPACE_APPLY=BLOCKED production_schema_not_ready"
            exit 3
          fi

      - name: Inspect current production RC workspace
        id: before
        shell: bash
        run: |
          set +e
          response=$(vercel curl /api/internal/rc-workspace \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          status=$?
          set -e
          printf '%s\n' "$response"
          if [ "$status" -ne 0 ]; then
            echo "RC_WORKSPACE_APPLY=BLOCKED production_runtime_unavailable"
            exit "$status"
          fi

          workspace_id=$(printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(body);
                if (parsed.status === "ready" && typeof parsed.workspaceId === "string") {
                  process.stdout.write(parsed.workspaceId);
                }
              } catch {}
            });
          ')
          if [ -n "$workspace_id" ]; then
            echo "already_ready=true" >> "$GITHUB_OUTPUT"
            echo "workspace_id=$workspace_id" >> "$GITHUB_OUTPUT"
            echo "RC_WORKSPACE_APPLY=SKIPPED already_ready"
          else
            echo "already_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply canonical RC workspace
        if: steps.before.outputs.already_ready != 'true'
        shell: bash
        run: |
          response=$(vercel curl /api/internal/rc-workspace \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"confirmation":"APPLY_RC_WORKSPACE_PRODUCTION"}')
          printf '%s\n' "$response"

      - name: Verify production RC workspace
        id: after
        shell: bash
        run: |
          response=$(vercel curl /api/internal/rc-workspace \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          printf '%s\n' "$response"
          workspace_id=$(printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(body);
              if (parsed.status !== "ready" || typeof parsed.workspaceId !== "string") process.exit(2);
              process.stdout.write(parsed.workspaceId);
            });
          ')
          echo "workspace_id=$workspace_id" >> "$GITHUB_OUTPUT"
          echo "RC_WORKSPACE_APPLY=PASS workspace_id=$workspace_id"

      - name: Publish production commit status
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKSPACE_ID: ${{ steps.after.outputs.workspace_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          main_sha=$(git rev-parse HEAD)
          export WORKSPACE_ID RUN_URL
          python - <<'PY' > /tmp/rc-workspace-status.json
          import json
          import os
          print(json.dumps({
              "state": "success",
              "context": "TKN RC Workspace/Production",
              "description": "Production RC workspace is ready",
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/rc-workspace-status.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$main_sha"

      - name: Comment approval issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          WORKSPACE_ID: ${{ steps.after.outputs.workspace_id }}
        run: |
          export WORKSPACE_ID
          python - <<'PY' > /tmp/rc-workspace-comment.json
          import json
          import os
          print(json.dumps({
              "body": (
                  "RC Production workspace bootstrap completed and verified.\n\n"
                  f"Workspace: `{os.environ['WORKSPACE_ID']}`\n\n"
                  "Signature: **Tehkné Solutions**"
              )
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/rc-workspace-comment.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"
