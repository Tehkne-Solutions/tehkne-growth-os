name: Release Candidate Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: growth-os-rc-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_SCOPE: thales-dvfs-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      WORKSPACE_ID: ${{ secrets.RC_WORKSPACE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify required release secrets
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$CRON_SECRET"
          test -n "$WORKSPACE_ID"

      - name: Install dependencies
        run: npm ci

      - name: Re-run production security audit
        run: npm run security:audit

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Ensure Vercel project exists
        run: |
          if vercel project inspect "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "Vercel project already exists"
          else
            vercel project add "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi

      - name: Link repository to Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy release candidate
        id: deploy
        run: |
          TARGET_FLAG=""
          if [ "${{ inputs.target }}" = "production" ]; then
            TARGET_FLAG="--prod"
          fi
          URL=$(vercel deploy $TARGET_FLAG --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "GROWTH_OS_BASE_URL=$URL" >> "$GITHUB_ENV"
          echo "Release candidate deployed to $URL"

      - name: Validate published release candidate
        run: npm run smoke:rc

      - name: Publish RC summary
        if: always()
        run: |
          {
            echo "## Tehkné Growth OS RC deployment"
            echo ""
            echo "- Target: ${{ inputs.target }}"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Signature: Tehkné Solutions"
          } >> "$GITHUB_STEP_SUMMARY"
