name: Release Candidate Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "sector-packs/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "vercel.json"
      - ".github/workflows/release-candidate-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: growth-os-rc-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_SCOPE: tehkne-solutions-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      WORKSPACE_ID: ${{ secrets.RC_WORKSPACE_ID }}
      RC_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Vercel deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "RC_DEPLOY=BLOCKED missing=VERCEL_TOKEN"
            exit 2
          fi

      - name: Install dependencies
        run: npm ci

      - name: Re-run production security audit
        run: npm run security:audit

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Ensure Vercel project exists
        run: |
          if vercel project inspect "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "Vercel project already exists"
          else
            vercel project add "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi

      - name: Link repository to Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy release candidate
        id: deploy
        run: |
          TARGET_FLAG=""
          if [ "$RC_TARGET" = "production" ]; then
            TARGET_FLAG="--prod"
          fi
          URL=$(vercel deploy $TARGET_FLAG --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "GROWTH_OS_BASE_URL=$URL" >> "$GITHUB_ENV"
          echo "Release candidate deployed to $URL"

      - name: Resolve RC workspace from deployed runtime
        id: workspace
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -n "$WORKSPACE_ID" ]; then
            echo "RC_WORKSPACE=READY source=secret-override"
            echo "source=secret-override" >> "$GITHUB_OUTPUT"
            echo "workspace_id=$WORKSPACE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "RC_WORKSPACE=PENDING missing=CRON_SECRET"
            echo "source=missing-cron-secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          response=$(vercel curl /api/internal/rc-workspace \
            --deployment "$DEPLOYMENT_URL" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          status=$?
          set -e

          printf '%s\n' "$response"

          if [ "$status" -ne 0 ]; then
            echo "RC_WORKSPACE=UNAVAILABLE runtime_status=$status"
            echo "source=runtime-unavailable" >> "$GITHUB_OUTPUT"
            if [ "$RC_TARGET" = "production" ]; then
              exit "$status"
            fi
            exit 0
          fi

          workspace_id=$(printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(body);
                if (parsed.status === "ready" && typeof parsed.workspaceId === "string") {
                  process.stdout.write(parsed.workspaceId);
                }
              } catch {}
            });
          ')

          if [ -z "$workspace_id" ]; then
            echo "RC_WORKSPACE=PENDING canonical_workspace_missing"
            echo "source=runtime-missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "WORKSPACE_ID=$workspace_id" >> "$GITHUB_ENV"
          echo "workspace_id=$workspace_id" >> "$GITHUB_OUTPUT"
          echo "source=runtime" >> "$GITHUB_OUTPUT"
          echo "RC_WORKSPACE=READY source=runtime"

      - name: Determine smoke readiness
        id: smoke-readiness
        run: |
          if [ -n "$CRON_SECRET" ] && [ -n "$WORKSPACE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "RC_SMOKE=READY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            missing=""
            [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET"
            [ -n "$WORKSPACE_ID" ] || missing="$missing canonical RC workspace"
            echo "RC_SMOKE=PENDING missing=$missing"
          fi

      - name: Validate published release candidate
        if: steps.smoke-readiness.outputs.ready == 'true'
        run: npm run smoke:rc

      - name: Publish RC summary
        if: always()
        run: |
          {
            echo "## Tehkné Growth OS RC deployment"
            echo ""
            echo "- Target: $RC_TARGET"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Workspace source: ${{ steps.workspace.outputs.source || 'not-resolved' }}"
            echo "- Workspace: ${{ steps.workspace.outputs.workspace_id || 'not-resolved' }}"
            echo "- Smoke: ${{ steps.smoke-readiness.outputs.ready == 'true' && 'executed' || 'pending workspace bootstrap' }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Signature: Tehkné Solutions"
          } >> "$GITHUB_STEP_SUMMARY"
