name: Release Candidate Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "sector-packs/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "vercel.json"
      - ".github/workflows/release-candidate-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: growth-os-rc-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_SCOPE: tehkne-solutions-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      WORKSPACE_ID: ${{ secrets.RC_WORKSPACE_ID }}
      RC_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
      PRODUCTION_PUBLIC_URL: https://tehkne-growth-os.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Vercel deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "RC_DEPLOY=BLOCKED missing=VERCEL_TOKEN"
            exit 2
          fi

      - name: Install dependencies
        run: npm ci

      - name: Re-run production security audit
        run: npm run security:audit

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Ensure Vercel project exists
        run: |
          if vercel project inspect "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "Vercel project already exists"
          else
            vercel project add "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi

      - name: Link repository to Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy release candidate
        id: deploy
        run: |
          TARGET_FLAG=""
          if [ "$RC_TARGET" = "production" ]; then
            TARGET_FLAG="--prod"
          fi
          URL=$(vercel deploy $TARGET_FLAG --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Release candidate deployed to $URL"

      - name: Inspect deployed schema readiness
        id: schema
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "RC_SCHEMA=PENDING missing=CRON_SECRET"
            exit 0
          fi

          set +e
          response=$(vercel curl /api/internal/schema-readiness \
            --deployment "$DEPLOYMENT_URL" \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          status=$?
          set -e
          printf '%s\n' "$response"

          if [ "$status" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "RC_SCHEMA=UNAVAILABLE runtime_status=$status"
            if [ "$RC_TARGET" = "production" ]; then
              exit "$status"
            fi
            exit 0
          fi

          schema_ready=$(printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const parsed = JSON.parse(body);
              process.stdout.write(parsed.schemaReady === true ? "true" : "false");
            });
          ')
          echo "ready=$schema_ready" >> "$GITHUB_OUTPUT"
          echo "RC_SCHEMA=$([ "$schema_ready" = "true" ] && echo READY || echo NOT_READY)"

      - name: Resolve RC workspace from deployed runtime
        id: workspace
        if: steps.schema.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -n "$WORKSPACE_ID" ]; then
            echo "RC_WORKSPACE=READY source=secret-override"
            echo "source=secret-override" >> "$GITHUB_OUTPUT"
            echo "workspace_id=$WORKSPACE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          response=$(vercel curl /api/internal/rc-workspace \
            --deployment "$DEPLOYMENT_URL" \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          status=$?
          set -e
          printf '%s\n' "$response"

          if [ "$status" -ne 0 ]; then
            echo "RC_WORKSPACE=UNAVAILABLE runtime_status=$status"
            echo "source=runtime-unavailable" >> "$GITHUB_OUTPUT"
            if [ "$RC_TARGET" = "production" ]; then
              exit "$status"
            fi
            exit 0
          fi

          workspace_id=$(printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(body);
                if (parsed.status === "ready" && typeof parsed.workspaceId === "string") {
                  process.stdout.write(parsed.workspaceId);
                }
              } catch {}
            });
          ')

          if [ -z "$workspace_id" ]; then
            echo "RC_WORKSPACE=PENDING canonical_workspace_missing"
            echo "source=runtime-missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "WORKSPACE_ID=$workspace_id" >> "$GITHUB_ENV"
          echo "workspace_id=$workspace_id" >> "$GITHUB_OUTPUT"
          echo "source=runtime" >> "$GITHUB_OUTPUT"
          echo "RC_WORKSPACE=READY source=runtime"

      - name: Determine smoke readiness
        id: smoke-readiness
        run: |
          if [ "${{ steps.schema.outputs.ready }}" = "true" ] && [ -n "$CRON_SECRET" ] && [ -n "$WORKSPACE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "RC_SMOKE=READY target=$RC_TARGET"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            missing=""
            [ "${{ steps.schema.outputs.ready }}" = "true" ] || missing="$missing production schema"
            [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET"
            [ -n "$WORKSPACE_ID" ] || missing="$missing canonical RC workspace"
            echo "RC_SMOKE=PENDING missing=$missing"
          fi

      - name: Validate protected Preview release candidate
        id: preview-smoke
        if: steps.smoke-readiness.outputs.ready == 'true' && env.RC_TARGET == 'preview'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          headers=$(mktemp)
          http_status=$(vercel curl / \
            --deployment "$DEPLOYMENT_URL" \
            -- \
            --silent \
            --show-error \
            --output /dev/null \
            --dump-header "$headers" \
            --write-out '%{http_code}')

          echo "RC_PREVIEW_PUBLIC http=$http_status mode=vercel-authenticated"
          if [ "$http_status" -ge 500 ]; then
            echo "RC_SMOKE=FAIL failures=public-http:$http_status"
            exit 1
          fi

          failures=""
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$headers" || failures="$failures header:x-content-type-options"
          grep -Eiq '^x-frame-options:' "$headers" || failures="$failures header:x-frame-options"
          grep -Eiq '^referrer-policy:' "$headers" || failures="$failures header:referrer-policy"
          grep -Eiq '^permissions-policy:' "$headers" || failures="$failures header:permissions-policy"
          grep -Eiq '^strict-transport-security:' "$headers" || failures="$failures header:strict-transport-security"

          if [ -n "$failures" ]; then
            echo "RC_SMOKE=FAIL failures=$failures"
            exit 1
          fi

          readiness=$(vercel curl "/api/internal/production-readiness?workspaceId=$WORKSPACE_ID" \
            --deployment "$DEPLOYMENT_URL" \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          printf '%s\n' "$readiness"

          printf '%s' "$readiness" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(body);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              const failed = checks.filter((check) => check.status === "fail");
              const warnings = checks.filter((check) => check.status === "warning");
              console.log(`RC_READINESS status=${payload.status ?? "unknown"} fail=${failed.length} warning=${warnings.length} signature=${payload.signature ?? "unknown"}`);
              for (const check of checks) console.log(`${String(check.status).toUpperCase()} ${check.key} :: ${check.detail}`);
              if (payload.status === "blocked" || failed.length > 0) process.exit(1);
            });
          '

          echo "RC_SMOKE=PASS mode=vercel-authenticated-preview headers=5/5"

      - name: Verify official Production alias targets this deployment
        id: production-alias
        if: steps.smoke-readiness.outputs.ready == 'true' && env.RC_TARGET == 'production'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          attached=false
          for attempt in $(seq 1 12); do
            inspect=$(vercel inspect "$DEPLOYMENT_URL" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" 2>&1 || true)
            if printf '%s\n' "$inspect" | grep -Fq "$PRODUCTION_PUBLIC_URL"; then
              attached=true
              break
            fi
            echo "RC_PRODUCTION_ALIAS=PENDING attempt=$attempt"
            sleep 5
          done

          if [ "$attached" != "true" ]; then
            echo "RC_PRODUCTION_ALIAS=FAIL expected=$PRODUCTION_PUBLIC_URL deployment=$DEPLOYMENT_URL"
            exit 1
          fi

          echo "RC_PRODUCTION_ALIAS=READY url=$PRODUCTION_PUBLIC_URL"

      - name: Validate published Production release candidate
        id: production-smoke
        if: steps.smoke-readiness.outputs.ready == 'true' && env.RC_TARGET == 'production'
        env:
          GROWTH_OS_BASE_URL: ${{ env.PRODUCTION_PUBLIC_URL }}
        run: npm run smoke:rc

      - name: Publish RC summary
        if: always()
        run: |
          {
            echo "## Tehkné Growth OS RC deployment"
            echo ""
            echo "- Target: $RC_TARGET"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Production public alias: $PRODUCTION_PUBLIC_URL"
            echo "- Schema: ${{ steps.schema.outputs.ready == 'true' && 'ready' || 'not-ready' }}"
            echo "- Workspace source: ${{ steps.workspace.outputs.source || 'not-resolved' }}"
            echo "- Workspace: ${{ steps.workspace.outputs.workspace_id || 'not-resolved' }}"
            echo "- Smoke prerequisites: ${{ steps.smoke-readiness.outputs.ready == 'true' && 'ready' || 'pending' }}"
            echo "- Preview smoke: ${{ steps.preview-smoke.outcome || 'not-run' }}"
            echo "- Production alias gate: ${{ steps.production-alias.outcome || 'not-run' }}"
            echo "- Production smoke: ${{ steps.production-smoke.outcome || 'not-run' }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Signature: Tehkné Solutions"
          } >> "$GITHUB_STEP_SUMMARY"
