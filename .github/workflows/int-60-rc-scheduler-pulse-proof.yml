name: INT-60 RC Scheduler Pulse Proof

on:
  pull_request:
    paths:
      - ".github/workflows/int-60-rc-scheduler-pulse-proof.yml"

permissions:
  contents: read

jobs:
  scheduler-pulse-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://tehkne-growth-os.vercel.app
      WORKSPACE_ID: 93000000-0000-4000-8000-000000000001
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fail-closed preflight — require zero ACTIVE connectors
        shell: bash
        run: |
          test -n "$CRON_SECRET"
          readiness=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/internal/production-readiness?workspaceId=$WORKSPACE_ID")
          printf 'PREFLIGHT_READINESS=%s\n' "$readiness"
          printf '%s' "$readiness" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(body);
              const paid = Number(payload?.firstSync?.paidMediaActive ?? -1);
              const crm = Number(payload?.firstSync?.crmActive ?? -1);
              const scheduler = Array.isArray(payload.checks)
                ? payload.checks.find((check) => check.key === "scheduler-pulse")
                : null;
              console.log(`RC_SCHEDULER_PREFLIGHT paid_active=${paid} crm_active=${crm} scheduler=${scheduler?.status ?? "unknown"} detail=${scheduler?.detail ?? "missing"}`);
              if (paid !== 0 || crm !== 0) {
                console.error("RC_SCHEDULER_PREFLIGHT=BLOCKED active_connectors_present");
                process.exit(2);
              }
              console.log("RC_SCHEDULER_PREFLIGHT=PASS zero_active_connectors");
            });
          '

      - name: Trigger one controlled Production scheduler pulse
        shell: bash
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "X-Scheduler-Source: github-actions" \
            "$PRODUCTION_URL/api/internal/connectors/scheduler")
          printf 'SCHEDULER_RESPONSE=%s\n' "$response"
          printf '%s' "$response" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(body);
              const paidProcessed = Number(payload?.paidMedia?.processed ?? -1);
              const crmProcessed = Number(payload?.crm?.processed ?? -1);
              const bad = payload.ok !== true || ["FAILED", "BUDGET_EXHAUSTED"].includes(payload.status);
              console.log(`RC_SCHEDULER_RUN run_id=${payload.runId ?? "missing"} status=${payload.status ?? "unknown"} paid_processed=${paidProcessed} crm_processed=${crmProcessed}`);
              if (bad || paidProcessed !== 0 || crmProcessed !== 0) process.exit(1);
            });
          '

      - name: Require scheduler pulse readiness PASS
        shell: bash
        run: |
          readiness=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/internal/production-readiness?workspaceId=$WORKSPACE_ID")
          printf 'POSTFLIGHT_READINESS=%s\n' "$readiness"
          printf '%s' "$readiness" | node -e '
            let body="";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(body);
              const checks = Array.isArray(payload.checks) ? payload.checks : [];
              const scheduler = checks.find((check) => check.key === "scheduler-pulse");
              const failed = checks.filter((check) => check.status === "fail");
              const warnings = checks.filter((check) => check.status === "warning");
              console.log(`RC_READINESS status=${payload.status ?? "unknown"} fail=${failed.length} warning=${warnings.length} signature=${payload.signature ?? "unknown"}`);
              console.log(`RC_SCHEDULER_POSTFLIGHT status=${scheduler?.status ?? "missing"} detail=${scheduler?.detail ?? "missing"}`);
              if (scheduler?.status !== "pass") process.exit(1);
              console.log("RC_SCHEDULER_PULSE=PASS");
            });
          '
