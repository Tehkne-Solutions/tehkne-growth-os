name: INT-44 PostgreSQL Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/int-44-postgres-discovery.yml"

permissions:
  contents: read

jobs:
  discover-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VERCEL_SCOPE: tehkne-solutions-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Vercel credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "POSTGRES_DISCOVERY=BLOCKED missing=VERCEL_TOKEN"
            exit 2
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link canonical project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: List current production deployments
        shell: bash
        run: |
          echo "PRODUCTION_DEPLOYMENTS_BEGIN"
          vercel list "$VERCEL_PROJECT_NAME" --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          echo "PRODUCTION_DEPLOYMENTS_END"

      - name: Probe production RC workspace runtime
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "RC_RUNTIME_PROBE=SKIPPED missing=CRON_SECRET"
            exit 0
          fi
          set +e
          response=$(vercel --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" curl /api/internal/rc-workspace \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          status=$?
          set -e
          printf '%s\n' "$response"
          echo "RC_RUNTIME_PROBE_EXIT=$status"

      - name: List existing marketplace resources
        shell: bash
        run: |
          echo "POSTGRES_DISCOVERY_RESOURCES_BEGIN"
          vercel integration list --all --format=json --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          echo "POSTGRES_DISCOVERY_RESOURCES_END"

      - name: List current project resources
        shell: bash
        run: |
          echo "POSTGRES_DISCOVERY_PROJECT_RESOURCES_BEGIN"
          vercel integration list "$VERCEL_PROJECT_NAME" --format=json --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          echo "POSTGRES_DISCOVERY_PROJECT_RESOURCES_END"

      - name: List Neon installations
        shell: bash
        run: |
          echo "POSTGRES_DISCOVERY_NEON_INSTALLATIONS_BEGIN"
          vercel integration installations --integration neon --format json --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          echo "POSTGRES_DISCOVERY_NEON_INSTALLATIONS_END"

      - name: Discover Postgres marketplace products
        shell: bash
        run: |
          echo "POSTGRES_DISCOVERY_MARKETPLACE_BEGIN"
          vercel integration discover postgres --format=json --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          echo "POSTGRES_DISCOVERY_MARKETPLACE_END"

      - name: Inspect Neon provisioning contract
        shell: bash
        run: |
          echo "POSTGRES_DISCOVERY_NEON_HELP_BEGIN"
          vercel integration add neon --help
          echo "POSTGRES_DISCOVERY_NEON_HELP_END"

      - name: Inspect existing resource connection contract
        shell: bash
        run: |
          echo "POSTGRES_DISCOVERY_CONNECT_HELP_BEGIN"
          vercel integration resource connect --help
          echo "POSTGRES_DISCOVERY_CONNECT_HELP_END"

      - name: List production environment variable names
        shell: bash
        run: |
          echo "POSTGRES_DISCOVERY_PRODUCTION_ENV_BEGIN"
          vercel env ls production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          echo "POSTGRES_DISCOVERY_PRODUCTION_ENV_END"

      - name: List preview environment variable names
        shell: bash
        run: |
          echo "POSTGRES_DISCOVERY_PREVIEW_ENV_BEGIN"
          vercel env ls preview --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          echo "POSTGRES_DISCOVERY_PREVIEW_ENV_END"
