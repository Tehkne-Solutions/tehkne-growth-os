name: Refresh INT-40 lockfile

on:
  push:
    branches: [agent/int-40-security-release-gate]

permissions:
  contents: write

concurrency:
  group: refresh-int40-lock
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/int-40-security-release-gate
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile with security overrides
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh lockfile for patched transitive dependencies"
          git push origin HEAD:agent/int-40-security-release-gate
