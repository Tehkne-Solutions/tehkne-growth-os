name: INT-58 RC Preview Proof

on:
  pull_request:
    paths:
      - ".github/workflows/int-58-rc-preview-proof.yml"
      - ".github/workflows/release-candidate-deploy.yml"

permissions:
  contents: read

jobs:
  preview-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_SCOPE: tehkne-solutions-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm install --global vercel@latest
      - name: Link project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Deploy protected Preview
        id: deploy
        shell: bash
        run: |
          url=$(vercel deploy --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "INT58_DEPLOYMENT=$url"
      - name: Prove schema and resolve workspace
        id: workspace
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          schema=$(vercel curl /api/internal/schema-readiness \
            --deployment "$DEPLOYMENT_URL" \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          printf 'SCHEMA_RESPONSE=%s\n' "$schema"
          printf '%s' "$schema" | node -e '
            let body=""; process.stdin.on("data",c=>body+=c); process.stdin.on("end",()=>{const p=JSON.parse(body); if(p.schemaReady!==true) process.exit(2);});
          '

          response=$(vercel curl /api/internal/rc-workspace \
            --deployment "$DEPLOYMENT_URL" \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          printf 'WORKSPACE_RESPONSE=%s\n' "$response"
          workspace_id=$(printf '%s' "$response" | node -e '
            let body=""; process.stdin.on("data",c=>body+=c); process.stdin.on("end",()=>{const p=JSON.parse(body); if(p.status!=="ready"||typeof p.workspaceId!=="string") process.exit(2); process.stdout.write(p.workspaceId);});
          ')
          echo "WORKSPACE_ID=$workspace_id" >> "$GITHUB_ENV"
          echo "workspace_id=$workspace_id" >> "$GITHUB_OUTPUT"
      - name: Prove protected Preview smoke
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          headers=$(mktemp)
          http_status=$(vercel curl / \
            --deployment "$DEPLOYMENT_URL" \
            -- \
            --silent \
            --show-error \
            --output /dev/null \
            --dump-header "$headers" \
            --write-out '%{http_code}')

          echo "RC_PREVIEW_PUBLIC http=$http_status mode=vercel-authenticated"
          test "$http_status" -lt 500

          failures=""
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$headers" || failures="$failures header:x-content-type-options"
          grep -Eiq '^x-frame-options:' "$headers" || failures="$failures header:x-frame-options"
          grep -Eiq '^referrer-policy:' "$headers" || failures="$failures header:referrer-policy"
          grep -Eiq '^permissions-policy:' "$headers" || failures="$failures header:permissions-policy"
          grep -Eiq '^strict-transport-security:' "$headers" || failures="$failures header:strict-transport-security"
          if [ -n "$failures" ]; then
            echo "RC_SMOKE=FAIL failures=$failures"
            exit 1
          fi

          readiness=$(vercel curl "/api/internal/production-readiness?workspaceId=$WORKSPACE_ID" \
            --deployment "$DEPLOYMENT_URL" \
            -- \
            --silent \
            --show-error \
            --fail-with-body \
            --header "Authorization: Bearer $CRON_SECRET")
          printf '%s\n' "$readiness"
          printf '%s' "$readiness" | node -e '
            let body=""; process.stdin.on("data",c=>body+=c); process.stdin.on("end",()=>{const p=JSON.parse(body); const checks=Array.isArray(p.checks)?p.checks:[]; const failed=checks.filter(c=>c.status==="fail"); const warnings=checks.filter(c=>c.status==="warning"); console.log(`RC_READINESS status=${p.status??"unknown"} fail=${failed.length} warning=${warnings.length} signature=${p.signature??"unknown"}`); if(p.status==="blocked"||failed.length>0) process.exit(1);});
          '
          echo "RC_SMOKE=PASS mode=vercel-authenticated-preview headers=5/5"
