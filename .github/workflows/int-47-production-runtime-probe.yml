name: INT-47 Production Runtime Probe

on:
  pull_request:
    paths:
      - ".github/workflows/int-47-production-runtime-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VERCEL_SCOPE: tehkne-solutions-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      GROWTH_OS_BASE_URL: https://tehkne-growth-os.vercel.app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@latest
      - name: Link Production project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Resolve RC workspace from Production runtime
        shell: bash
        run: |
          response=$(vercel curl /api/internal/rc-workspace -- --silent --show-error --fail-with-body --header "Authorization: Bearer $CRON_SECRET")
          printf 'WORKSPACE_RESPONSE=%s\n' "$response"
          workspace_id=$(printf '%s' "$response" | node -e '
            let body=""; process.stdin.on("data",c=>body+=c); process.stdin.on("end",()=>{const p=JSON.parse(body); if(p.status!=="ready"||typeof p.workspaceId!=="string") process.exit(2); process.stdout.write(p.workspaceId);});
          ')
          echo "WORKSPACE_ID=$workspace_id" >> "$GITHUB_ENV"
      - name: Run RC smoke against official public Production alias
        run: node scripts/release-candidate-smoke.mjs
