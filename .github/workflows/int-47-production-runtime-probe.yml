name: INT-47 Production Runtime Probe

on:
  pull_request:
    paths:
      - ".github/workflows/int-47-production-runtime-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VERCEL_SCOPE: tehkne-solutions-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@latest
      - name: Link Production project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Probe schema and workspace
        shell: bash
        run: |
          vercel curl /api/internal/schema-readiness -- --silent --show-error --fail-with-body --header "Authorization: Bearer $CRON_SECRET"
          echo
          vercel curl /api/internal/rc-workspace -- --silent --show-error --fail-with-body --header "Authorization: Bearer $CRON_SECRET"
          echo
      - name: Inspect current Production deployment and aliases
        shell: bash
        run: |
          output=$(vercel list "$VERCEL_PROJECT_NAME" --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          printf '%s\n' "$output"
          url=$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | head -n 1)
          test -n "$url"
          echo "DEPLOYMENT_URL=$url"
          vercel inspect "$url" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          echo "ALIASES_BEGIN"
          vercel alias ls --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" || true
          echo "ALIASES_END"
      - name: Probe likely stable Production alias
        shell: bash
        run: |
          for url in \
            "https://tehkne-growth-os.vercel.app" \
            "https://tehkne-growth-os-tehkne-solutions-projects.vercel.app"; do
            echo "PROBE_URL=$url"
            curl --silent --show-error --location --max-redirs 0 -D - -o /dev/null "$url/" || true
          done
