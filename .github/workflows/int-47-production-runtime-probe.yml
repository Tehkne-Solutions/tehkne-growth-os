name: INT-47 Production Runtime Probe

on:
  pull_request:
    paths:
      - ".github/workflows/int-47-production-runtime-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VERCEL_SCOPE: tehkne-solutions-projects
      VERCEL_PROJECT_NAME: tehkne-growth-os
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      WORKSPACE_ID: ${{ secrets.RC_WORKSPACE_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@latest
      - name: Link Production project
        run: vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Probe schema readiness
        shell: bash
        run: |
          response=$(vercel curl /api/internal/schema-readiness -- --silent --show-error --fail-with-body --header "Authorization: Bearer $CRON_SECRET")
          printf 'SCHEMA_RESPONSE=%s\n' "$response"
      - name: Probe RC workspace
        shell: bash
        run: |
          response=$(vercel curl /api/internal/rc-workspace -- --silent --show-error --fail-with-body --header "Authorization: Bearer $CRON_SECRET")
          printf 'WORKSPACE_RESPONSE=%s\n' "$response"
      - name: Resolve current Production deployment URL
        id: production
        shell: bash
        run: |
          output=$(vercel list "$VERCEL_PROJECT_NAME" --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          printf '%s\n' "$output"
          url=$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | head -n 1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Run RC smoke against Production
        env:
          GROWTH_OS_BASE_URL: ${{ steps.production.outputs.url }}
        run: node scripts/release-candidate-smoke.mjs
